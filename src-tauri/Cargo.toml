[package]
name = "satchel"
version = "0.1.0"
description = "A minimal onchain Bitcoin wallet"
edition = "2021"

[lib]
name = "satchel_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
aes-gcm = "0.10"
argon2 = "0.5"
base64 = "0.22"
bdk_bitcoind_rpc = "0.22"
bdk_wallet = { version = "3.1", features = ["compiler", "keys-bip39", "rusqlite"] }
rand = "0.8"
thiserror = "2"
uuid = { version = "1", features = ["v4"] }
zeroize = "1"
tauri-plugin-clipboard-manager = "2"
tauri-plugin-dialog = "2.7.2"
url = "2"
# Enables rustls for the already-transitive minreq transport used by bitcoincore-rpc.
# This keeps remote RPC TLS inside the existing audited HTTP client rather than adding another client.
minreq = { version = "=2.14.1", features = ["https-rustls"] }
# Reviewed in ADR 0016: no build script, forbids unsafe code, MIT, and implements
# the Blockchain Commons UR v2 fountain/Bytewords reference vectors.
ur = "=0.4.1"
# Enables the upstream rust-bitcoin JSON-RPC SOCKS5 transport for explicit Tor onion RPC.
# `socks 0.3.4` was source-reviewed; no build script or process execution is present.
# Direct RPC explicitly uses minreq because this feature changes simple_http globally.
jsonrpc = { version = "=0.18.0", features = ["proxy"] }

[target.'cfg(any(target_os = "macos", target_os = "ios"))'.dependencies]
security-framework = { path = "vendor/security-framework" }

[target.'cfg(target_os = "macos")'.dependencies]
block2 = "0.6.2"
objc2 = "0.6.4"
objc2-app-kit = "0.3.2"
objc2-foundation = "0.3.2"

[patch.crates-io]
security-framework-sys = { path = "vendor/security-framework-sys" }
