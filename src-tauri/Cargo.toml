[package]
name = "groot"
version = "0.4.92"
description = "Groot, a minimal onchain Bitcoin wallet"
edition = "2021"

[lib]
name = "groot_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "Groot"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "=2.6.3", features = [] }

[dependencies]
tauri = { version = "=2.11.5", features = [] }
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.150"
aes-gcm = "=0.10.3"
argon2 = "=0.5.3"
base64 = "=0.22.1"
bip39 = { version = "=2.2.2", features = ["zeroize"] }
bdk_bitcoind_rpc = "=0.22.0"
bdk_wallet = { version = "=3.1.0", features = ["compiler", "keys-bip39", "rusqlite"] }
# Reviewed for Issues #7 and #10. Kyoto owns verified BIP157/BIP158 P2P
# discovery; PDK owns BIP77 protocol state. Groot retains wallet, PSBT,
# persistence, signing, fee, and broadcast authority.
bdk_kyoto = "=0.17.0"
payjoin = { version = "=1.0.0", default-features = false, features = ["v2"] }
rand = "=0.8.7"
thiserror = "=2.0.18"
uuid = { version = "=1.24.0", features = ["v4"] }
zeroize = "=1.9.0"
tauri-plugin-clipboard-manager = "=2.3.2"
tauri-plugin-dialog = "=2.7.2"
tauri-plugin-opener = "=2.5.4"
url = "=2.5.8"
# Enables the platform-native TLS verifier for the already-transitive, pinned
# minreq transport. ADR 0020 records why the legacy rustls backend is forbidden.
minreq = { version = "=2.14.1", features = ["https-native"] }
# Reviewed in ADR 0016: no build script, forbids unsafe code, MIT, and implements
# the Blockchain Commons UR v2 fountain/Bytewords reference vectors.
ur = "=0.4.1"
# Direct HTTPS wraps the pinned minreq transport with local bounds and no redirects.
# Explicit Tor is local so .onion hostnames reach SOCKS5 without host DNS.
jsonrpc = "=0.18.0"

[target.'cfg(unix)'.dependencies]
libc = "=0.2.186"

[target.'cfg(target_os = "macos")'.dependencies]
block2 = "=0.6.2"
core-foundation = "=0.10.1"
objc2 = "=0.6.4"
objc2-app-kit = "=0.3.2"
objc2-core-foundation = "=0.3.2"
objc2-foundation = "=0.3.2"
objc2-web-kit = { version = "=0.3.2", default-features = false, features = ["block2", "objc2-core-foundation", "WKPDFConfiguration", "WKWebView"] }
# The packaged HWI sidecar is checked with macOS Code Signing Services before
# execution. Both crates were already pinned transitively by the keychain stack.
security-framework = "=3.7.0"

[patch.crates-io]
security-framework-sys = { path = "vendor/security-framework-sys" }

# bip157 0.6.3's only debug-assertion-only behavior is an unconditional stdout
# logging macro. Keep peer and matching-block metadata out of Groot's dev/test
# process output while retaining the reviewed, pinned dependency unchanged.
[profile.dev.package.bip157]
debug-assertions = false

[profile.test.package.bip157]
debug-assertions = false

# Release bundles keep symbols out of the shipped executable and use ThinLTO to
# remove duplicated cross-crate code without selecting size-first optimization
# that could slow wallet, network, or cryptographic operations at runtime.
[profile.release]
codegen-units = 1
lto = "thin"
strip = "symbols"
