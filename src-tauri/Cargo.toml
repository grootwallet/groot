[package]
name = "satchel"
version = "0.1.0"
description = "A minimal onchain Bitcoin wallet"
edition = "2021"

[lib]
name = "satchel_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
aes-gcm = "0.10"
argon2 = "0.5"
base64 = "0.22"
bdk_bitcoind_rpc = "0.22"
bdk_wallet = { version = "3.1", features = ["compiler", "keys-bip39", "rusqlite"] }
rand = "0.8"
thiserror = "2"
uuid = { version = "1", features = ["v4"] }
zeroize = "1"
tauri-plugin-clipboard-manager = "2"
tauri-plugin-dialog = "2.7.2"
url = "2"

[target.'cfg(any(target_os = "macos", target_os = "ios"))'.dependencies]
security-framework = { path = "vendor/security-framework" }

[target.'cfg(target_os = "macos")'.dependencies]
block2 = "0.6.2"
objc2 = "0.6.4"
objc2-app-kit = "0.3.2"
objc2-foundation = "0.3.2"

[patch.crates-io]
security-framework-sys = { path = "vendor/security-framework-sys" }
