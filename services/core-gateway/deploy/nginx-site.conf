server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name bitcoin-rpc.usegroot.com;
    server_tokens off;
    access_log off;

    ssl_certificate /etc/letsencrypt/live/bitcoin-rpc.usegroot.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/bitcoin-rpc.usegroot.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    location = / {
        limit_except POST { deny all; }
        limit_req zone=groot_gateway_ip burst=100 nodelay;
        limit_req_status 429;
        limit_conn groot_gateway_conn 15;
        limit_conn_status 429;
        client_max_body_size 2m;

        proxy_pass http://127.0.0.1:8432/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Authorization $http_authorization;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_connect_timeout 2s;
        proxy_send_timeout 15s;
        proxy_read_timeout 125s;
    }

    location = /enroll {
        limit_except POST { deny all; }
        limit_req zone=groot_gateway_enroll burst=8 nodelay;
        limit_req_status 429;
        limit_conn groot_gateway_conn 2;
        limit_conn_status 429;
        client_max_body_size 64;

        proxy_pass http://127.0.0.1:8432/enroll;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_connect_timeout 2s;
        proxy_send_timeout 5s;
        proxy_read_timeout 5s;
    }

    location / {
        return 404;
    }
}

server {
    listen 80;
    listen [::]:80;
    server_name bitcoin-rpc.usegroot.com;
    return 301 https://$host$request_uri;
}
