# Define this once in nginx.conf's http {} block.
limit_req_zone $binary_remote_addr zone=groot_gateway_ip:10m rate=25r/s;
limit_conn_zone $binary_remote_addr zone=groot_gateway_conn:10m;

# Put this location in the TLS server for the dedicated gateway hostname.
location = / {
    limit_except POST { deny all; }
    limit_req zone=groot_gateway_ip burst=100 nodelay;
    # Stay below the gateway's 16-handler ceiling so one abusive source is
    # rejected here before it can consume every handler.
    limit_conn groot_gateway_conn 15;
    client_max_body_size 2m;
    access_log off;

    proxy_pass http://127.0.0.1:8432/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header Authorization $http_authorization;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header Connection "";
    proxy_buffering off;
    proxy_connect_timeout 2s;
    proxy_send_timeout 15s;
    # The gateway gives synchronous indexed block scans up to 120 seconds.
    # Keep the outer TLS proxy above that bound so it never abandons a Core
    # scan that the gateway is still legitimately waiting to complete.
    proxy_read_timeout 125s;
}
