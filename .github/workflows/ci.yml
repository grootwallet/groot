name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend-checks:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 11.13.1
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 24.19.0
          cache: pnpm
      - name: Install CI tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ripgrep
      - run: pnpm install --frozen-lockfile
        id: dependencies
      - run: pnpm audit --prod --audit-level high
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
        id: toolchain
        with:
          toolchain: 1.97.1
          components: clippy,rustfmt,llvm-tools-preview
      - name: Static boundaries, release gates, unit coverage, and build
        shell: bash
        run: |
          set -o pipefail
          set -eu
          ci_validation_script="$(node scripts/quality/ci-validation-mode.mjs)"
          case "$ci_validation_script" in
            validate:ci|validate:internal) ;;
            *) printf 'Unknown CI validation script\n' >&2; exit 1 ;;
          esac
          TIMEFORMAT='real %3R s; user %3U s; sys %3S s'
          { time pnpm "$ci_validation_script"; } 2>&1 | tee "$RUNNER_TEMP/frontend-validation.log"
      - name: Deterministic CycloneDX SBOM and dependency-license evidence
        if: ${{ !cancelled() && steps.dependencies.outcome == 'success' && steps.toolchain.outcome == 'success' }}
        run: pnpm test:sbom
      - name: Retain validation evidence
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: frontend-validation-${{ github.sha }}
          path: ${{ runner.temp }}/frontend-validation.log
          if-no-files-found: warn
          retention-days: 14

  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - project: desktop
            browser: chromium
            shard: 1
            shards: 2
          - project: desktop
            browser: chromium
            shard: 2
            shards: 2
          - project: mobile
            browser: webkit
            shard: 1
            shards: 4
          - project: mobile
            browser: webkit
            shard: 2
            shards: 4
          - project: mobile
            browser: webkit
            shard: 3
            shards: 4
          - project: mobile
            browser: webkit
            shard: 4
            shards: 4
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 11.13.1
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 24.19.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Generate SvelteKit TypeScript configuration
        run: pnpm exec svelte-kit sync
      - run: pnpm exec playwright install --with-deps ${{ matrix.browser }}
      - name: Browser acceptance tests (one isolated worker per shard)
        shell: bash
        run: |
          set -o pipefail
          TIMEFORMAT='real %3R s; user %3U s; sys %3S s'
          { time pnpm test:acceptance --fully-parallel --project=${{ matrix.project }} --shard=${{ matrix.shard }}/${{ matrix.shards }} --workers=1 --global-timeout=1500000; } 2>&1 | tee "$RUNNER_TEMP/browser-${{ matrix.project }}-shard-${{ matrix.shard }}-of-${{ matrix.shards }}.log"
      - name: Retain browser logs and failure traces
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: browser-${{ matrix.project }}-shard-${{ matrix.shard }}-of-${{ matrix.shards }}-${{ github.sha }}
          path: |
            ${{ runner.temp }}/browser-${{ matrix.project }}-shard-${{ matrix.shard }}-of-${{ matrix.shards }}.log
            test-results/
          if-no-files-found: warn
          retention-days: 14

  rust:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        lane: [test, checks]
    env:
      CARGO_TARGET_DIR: ${{ github.workspace }}/src-tauri/target/normal
    defaults:
      run:
        working-directory: src-tauri
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Tauri Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential \
            libappindicator3-dev \
            librsvg2-dev \
            libssl-dev \
            libudev-dev \
            libwebkit2gtk-4.1-dev \
            patchelf
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
        with:
          toolchain: 1.97.1
          components: clippy,rustfmt
      - name: Cache ordinary Rust dependencies
        uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          workspaces: src-tauri -> target/normal
          key: ordinary-v2-audit-0.22.2
          cache-workspace-crates: false
          save-if: ${{ github.ref == 'refs/heads/main' && matrix.lane == 'test' }}
      - run: cargo fmt --check
        if: matrix.lane == 'checks'
      - run: cargo clippy --locked --all-targets --all-features -- -D warnings
        if: matrix.lane == 'checks'
      - name: Rust unit and integration tests (pyramid base and middle)
        if: matrix.lane == 'test'
        run: |
          set -o pipefail
          TIMEFORMAT='real %3R s; user %3U s; sys %3S s'
          { time cargo test --locked --all-targets --all-features; } 2>&1 | tee "$RUNNER_TEMP/rust-tests.log"
      - name: Execute Rust documentation examples
        if: matrix.lane == 'test'
        run: cargo test --locked --doc --all-features
      - name: Build Rust API documentation with warnings denied
        if: matrix.lane == 'checks'
        run: RUSTDOCFLAGS="-D warnings" cargo doc --locked --no-deps --all-features
      - name: Compile every permitted native network
        if: matrix.lane == 'checks'
        run: bash ../scripts/network/check-native-builds.sh
      - name: Record ordinary Rust disk usage
        if: always()
        run: |
          df -h . > "$RUNNER_TEMP/rust-disk.log"
          if [[ -d "$CARGO_TARGET_DIR" ]]; then
            du -sh "$CARGO_TARGET_DIR" >> "$RUNNER_TEMP/rust-disk.log"
          fi
          cat "$RUNNER_TEMP/rust-disk.log"
      - name: Retain native test evidence
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: native-validation-${{ matrix.lane }}-${{ github.sha }}
          path: ${{ runner.temp }}/rust-*.log
          if-no-files-found: warn
          retention-days: 14

  rust-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: src-tauri
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
        with:
          toolchain: 1.97.1
      - run: cargo install cargo-audit --locked --version 0.22.2
      - run: cargo audit --file Cargo.lock

  rust-coverage:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      CARGO_LLVM_COV_TARGET_DIR: ${{ github.workspace }}/src-tauri/target/coverage
      # Leave CPU for the parallel funded fixtures. Those binaries use one thread.
      RUST_TEST_THREADS: '2'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
        with:
          toolchain: 1.97.1
          components: llvm-tools-preview
      - name: Cache instrumented dependencies and pinned coverage tool
        uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          workspaces: src-tauri -> target/coverage
          key: coverage-v2-llvm-cov-0.8.7
          cache-workspace-crates: false
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Provision Linux, locked coverage tooling, and checksum-pinned Core
        run: |
          set -euo pipefail
          (
            sudo apt-get update
            sudo apt-get install -y --no-install-recommends \
              build-essential libappindicator3-dev librsvg2-dev libssl-dev libudev-dev \
              libwebkit2gtk-4.1-dev patchelf
          ) &
          linux_pid=$!
          cargo install cargo-llvm-cov --locked --version 0.8.7 &
          tool_pid=$!
          (
            archive="$RUNNER_TEMP/bitcoin-31.1-x86_64-linux-gnu.tar.gz"
            curl --proto '=https' --tlsv1.2 --fail --location --silent --show-error \
              --output "$archive" \
              https://bitcoincore.org/bin/bitcoin-core-31.1/bitcoin-31.1-x86_64-linux-gnu.tar.gz
            echo "b80d9c3e04da78fb6f0569685673418cf686fadba9042d926d13fb87ff503f9e  $archive" | sha256sum --check --strict
            tar --extract --gzip --file "$archive" --directory "$RUNNER_TEMP"
          ) &
          core_pid=$!
          result=0
          for pid in "$linux_pid" "$tool_pid" "$core_pid"; do
            wait "$pid" || result=1
          done
          if [[ "$result" != 0 ]]; then exit "$result"; fi
          echo "$RUNNER_TEMP/bitcoin-31.1/bin" >> "$GITHUB_PATH"
      - name: Enforce deterministic-core coverage, then whole-library coverage with real Core
        run: |
          set -o pipefail
          TIMEFORMAT='real %3R s; user %3U s; sys %3S s'
          { time bash scripts/quality/check-rust-full-coverage.sh; } 2>&1 | tee "$RUNNER_TEMP/rust-coverage.log"
      - name: Record final native disk usage
        if: always()
        run: |
          df -h . > "$RUNNER_TEMP/rust-disk-after-coverage.log"
          if [[ -d "$CARGO_LLVM_COV_TARGET_DIR" ]]; then
            du -sh "$CARGO_LLVM_COV_TARGET_DIR" >> "$RUNNER_TEMP/rust-disk-after-coverage.log"
          fi
          cat "$RUNNER_TEMP/rust-disk-after-coverage.log"
      - name: Retain native coverage evidence
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: native-coverage-${{ github.sha }}
          path: |
            ${{ runner.temp }}/rust-coverage.log
            ${{ runner.temp }}/rust-disk-after-coverage.log
          if-no-files-found: warn
          retention-days: 14

  # Preserve the existing required frontend check as the full acceptance gate.
  frontend:
    if: always()
    needs: [frontend-checks, browser, rust, rust-audit, rust-coverage]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 24.19.0
      - name: Require every acceptance lane to succeed
        env:
          CI_REQUIRED_RESULTS: ${{ toJSON(needs) }}
        run: |
          node --input-type=module <<'NODE'
          const expected = ['frontend-checks', 'browser', 'rust', 'rust-audit', 'rust-coverage'];
          const results = JSON.parse(process.env.CI_REQUIRED_RESULTS);
          if (Object.keys(results).length !== expected.length) {
            throw new Error('Acceptance result inventory is incomplete or unexpected');
          }
          for (const job of expected) {
            if (results[job]?.result !== 'success') {
              throw new Error(`Required acceptance lane ${job} did not succeed`);
            }
          }
          console.log('Every required acceptance lane succeeded');
          NODE
