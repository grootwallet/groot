name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 11.13.1
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 24.19.0
          cache: pnpm
      - name: Install CI tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ripgrep
      - run: pnpm install --frozen-lockfile
      - run: pnpm audit --prod --audit-level high
      - name: Static boundaries, release gates, and build
        run: pnpm validate
      - name: Unit and domain-policy coverage (pyramid base)
        run: pnpm test:coverage
      - run: pnpm exec playwright install --with-deps chromium webkit
      - name: Browser acceptance tests (pyramid top)
        run: pnpm test:acceptance

  rust:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src-tauri
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Tauri Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential \
            libappindicator3-dev \
            librsvg2-dev \
            libssl-dev \
            libwebkit2gtk-4.1-dev \
            patchelf
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
        with:
          toolchain: 1.97.1
          components: clippy,rustfmt
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          workspaces: src-tauri
      - run: cargo fmt --check
      - run: cargo clippy --locked --all-targets --all-features -- -D warnings
      - name: Build Rust API documentation with warnings denied
        run: RUSTDOCFLAGS="-D warnings" cargo doc --locked --no-deps --all-features
      - name: Rust unit and integration tests (pyramid base and middle)
        run: cargo test --locked --all-features
      - name: Install pinned Bitcoin Core 31.1 for isolated Regtest
        run: |
          archive=/tmp/bitcoin-31.1-x86_64-linux-gnu.tar.gz
          curl --proto '=https' --tlsv1.2 --fail --location --silent --show-error \
            --output "$archive" \
            https://bitcoincore.org/bin/bitcoin-core-31.1/bitcoin-31.1-x86_64-linux-gnu.tar.gz
          echo "b80d9c3e04da78fb6f0569685673418cf686fadba9042d926d13fb87ff503f9e  $archive" | sha256sum --check --strict
          tar --extract --gzip --file "$archive" --directory /tmp
          echo "/tmp/bitcoin-31.1/bin" >> "$GITHUB_PATH"
      - name: Real Bitcoin Core Regtest multisig and recovery
        run: bash ../scripts/regtest/test.sh
      - name: Install security and coverage tools
        run: |
          cargo install cargo-audit --locked --version 0.22.2
          cargo install cargo-llvm-cov --locked --version 0.8.7
      - run: cargo audit --file Cargo.lock
      - name: Enforce explicitly classified deterministic-core coverage
        run: bash ../scripts/quality/check-rust-coverage.sh
      - name: Prevent whole-library coverage regression
        run: cargo llvm-cov --locked --lib --summary-only --fail-under-lines 55 --fail-under-functions 51 --fail-under-regions 51
