name: Marketplace fixture verification

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: marketplace-verification-${{ github.ref }}
  cancel-in-progress: true

jobs:
  marketplace-fixtures:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      pnpm_config_verify_deps_before_run: 'false'
      GROOT_MARKETPLACE_DISCOVERY: '0'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 11.13.1
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 24.19.0
          cache: pnpm
      - name: Install exactly locked dependencies without lifecycle scripts
        run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Install browsers selected by the locked Playwright version
        run: pnpm exec playwright install --with-deps chromium webkit
      - name: Repeat isolated fixture acceptance without retries or live providers
        run: pnpm verify:marketplace
      - name: Preserve local fixture evidence, including failed runs
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: marketplace-fixtures-${{ github.run_id }}-${{ github.run_attempt }}
          path: outputs/marketplace-readiness/
          if-no-files-found: warn
          retention-days: 7
