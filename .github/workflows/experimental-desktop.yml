name: Experimental desktop packages
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  package:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            bundle: deb
          - os: windows-2025
            bundle: msi
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 11.13.1
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 24.19.0
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
        with:
          toolchain: 1.97.1
          components: clippy,rustfmt
      - name: Install Linux runtime/build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends build-essential libappindicator3-dev librsvg2-dev libssl-dev libwebkit2gtk-4.1-dev patchelf ripgrep
      - run: pnpm install --frozen-lockfile
      # All gates retained: rc03 currently fails its independent source-policy review.
      - run: pnpm validate
        shell: bash
      - run: cargo fmt --check
        working-directory: src-tauri
      - run: cargo clippy --locked --all-targets --all-features -- -D warnings
        working-directory: src-tauri
      - run: cargo test --locked --all-features
        working-directory: src-tauri
      - name: Build isolated Signet package (no bundled helper or Mainnet)
        run: pnpm exec tauri build --config src-tauri/tauri.experimental.conf.json --bundles ${{ matrix.bundle }}
        env:
          GROOT_BUILD_NETWORK: signet
      - name: Verify native frontend
        run: node scripts/release/verify-native-frontend-output.mjs build
      - name: Generate target-specific SBOM
        shell: bash
        run: |
          if [[ "$RUNNER_OS" == "Windows" ]]; then executable=src-tauri/target/release/Groot.exe; else executable=src-tauri/target/release/Groot; fi
          node scripts/release/generate-sbom.mjs "$RUNNER_TEMP/groot-experimental.cdx.json" "$executable"
      - name: Collect experimental owner-test evidence
        shell: bash
        run: |
          mkdir -p experimental-artifacts
          if [[ "$RUNNER_OS" == "Windows" ]]; then cp src-tauri/target/release/bundle/msi/*.msi experimental-artifacts/; else cp src-tauri/target/release/bundle/deb/*.deb experimental-artifacts/; fi
          cp "$RUNNER_TEMP/groot-experimental.cdx.json" experimental-artifacts/
          cp docs/experimental-desktop.md docs/release-notes-5.2.0.md experimental-artifacts/
          git rev-parse HEAD > experimental-artifacts/SOURCE-COMMIT
          cd experimental-artifacts
          if [[ "$RUNNER_OS" == "Windows" ]]; then sha256sum *.msi > SHA256SUMS; else sha256sum *.deb > SHA256SUMS; fi
      # Dispatch-only supporting evidence, never public release publication or PR upload.
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: experimental-${{ matrix.os }}-${{ github.sha }}
          path: experimental-artifacts/
          if-no-files-found: error
          retention-days: 14
